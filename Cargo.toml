[workspace]
resolver = "3"
members = [
    "apps/server",
    "starter", # starter:template
]
default-members = ["apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
axum = "0.8.9"
include_dir = "0.7.4" # starter:web
maud = { version = "0.27.0", features = ["axum"] } # starter:htmx
mime_guess = "2.0.5" # starter:web
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
